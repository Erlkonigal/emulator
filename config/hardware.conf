# Hardware Configuration
# Format: KEY=VALUE (hex values with 0x prefix)

# ROM base address
ROM_BASE=0x00000000

# RAM base address
RAM_BASE=0x80000000

# RAM size (256MB)
RAM_SIZE=0x10000000

# UART base address
UART_BASE=0x10000000

# UART size
UART_SIZE=0x1000

# Default debug port
DEFAULT_DEBUG_PORT=1234

# CPU frequency (Hz)
CPU_FREQUENCY=1000000

# Commit queue size
COMMIT_QUEUE_SIZE=1024

# Maximum number of registers
MAX_NUM_REGISTERS=32

# Maximum number of CSRs
MAX_NUM_CSR=64

# Maximum number of commits per cycle
MAX_NUM_COMMITS_PER_CYCLE=8

# Maximum number of commits per consumption
MAX_NUM_COMMITS_PER_CONSUMPTION=256

# Padding for alignment
PADDING=64

# Maximum instruction decode string length
MAX_INST_DECODE_LEN=64